[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repurpose-kg"
version = "1.0.0"
description = "Time-split scores for drug-disease links."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Choppa Devasai Pranatheswar" }]
dependencies = []

[project.scripts]
repurpose-kg = "repurpose_kg.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
